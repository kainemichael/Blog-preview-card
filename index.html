<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <link rel="stylesheet" href="./assets/css/style.css"> 
    
    <title>Frontend Mentor | Blog preview card</title>
</head>
<body>
    <main>
        <article class="card">
            <figure class="blog-image">
                <img src="assets\images\illustration-article.svg"
                alt="illustration-article">
            </figure> 
          
            <div class="content"> 
                <div class="category-badge"> 
                  <span class="category-text">Learning</span>
                </div>
          
                <p class="publish-date"> Published 21 Dec 2023 </p>
                
                <h1 class="blog-title">
                  <a href="#" class="title-link"> HTML & CSS foundations </a>
                </h1>
          
                <p class="description">
                  These languages are the backbone of every website, defining structure, content, and presentation.
                </p>
            </div>
          
            <footer class="author">
                <img src="assets\images\image-avatar.webp" alt="Headshot of a young man" class="author-image">
                <p class="author-name">
                  Greg Hooper
                </p>
            </footer>
        </article>
    </main>
</body>
</html>
